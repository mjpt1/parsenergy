{% load i18n %}
<div id="ai-chat" dir="rtl">
  <style>
    #ai-chat{position:fixed;bottom:18px;left:18px;z-index:1050;font-family:inherit}
    #ai-chat .aic-toggle{width:56px;height:56px;border-radius:50%;border:0;background:#5f9a4b;color:#fff;font-size:24px;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
    #ai-chat .aic-panel{position:absolute;bottom:68px;left:0;width:min(340px,calc(100vw - 36px));background:#fff;color:#1d2a22;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.25);overflow:hidden}
    #ai-chat .aic-head{background:#5f9a4b;color:#fff;padding:10px 14px;font-weight:600}
    #ai-chat .aic-log{height:300px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
    #ai-chat .aic-msg{padding:8px 11px;border-radius:12px;line-height:1.8;white-space:pre-wrap;max-width:88%;font-size:.92rem}
    #ai-chat .aic-msg.user{align-self:flex-start;background:#e8f2e3}
    #ai-chat .aic-msg.assistant{align-self:flex-end;background:#f2f2f2}
    #ai-chat form{display:flex;border-top:1px solid #eee}
    #ai-chat input{flex:1;border:0;padding:12px;font:inherit;outline:none}
    #ai-chat form button{border:0;background:none;color:#5f9a4b;font-weight:700;padding:0 14px;cursor:pointer}
  </style>
  <div class="aic-panel" hidden>
    <div class="aic-head">{% trans "دستیار پارس انرژی" %}</div>
    <div class="aic-log"><div class="aic-msg assistant">{% trans "سلام! سؤالی دربارهٔ نیروگاه خورشیدی دارید؟ بپرسید." %}</div></div>
    <form>{% csrf_token %}<input type="text" maxlength="500" placeholder="{% trans 'سؤال خود را بنویسید…' %}" aria-label="{% trans 'پیام' %}"><button type="submit">{% trans "ارسال" %}</button></form>
  </div>
  <button type="button" class="aic-toggle" aria-label="{% trans 'گفتگو با دستیار' %}">💬</button>
</div>
