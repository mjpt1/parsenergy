{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="panel">
  <h1 class="h4 mb-3">{% trans "فرم مجوز" %}</h1>
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">{% trans "کد مجوز" %}</label>
        {{ form.code }}
      </div>
      <div class="col-md-6">
        <label class="form-label">{% trans "توضیح" %}</label>
        {{ form.description }}
      </div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn">{% trans "ذخیره" %}</button>
      <a class="btn secondary" data-ajax="true" href="{% url 'accounts:permissions' %}">{% trans "بازگشت" %}</a>
    </div>
  </form>
</div>
{% endblock %}
