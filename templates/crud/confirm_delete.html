{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="panel">
  <h1 class="h4 mb-3">{% trans "حذف" %}</h1>
  <p>{% trans "آیا از حذف این مورد مطمئن هستید؟" %}</p>
  <form method="post">{% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn">{% trans "حذف" %}</button>
      <a href="javascript:history.back()" class="btn secondary">{% trans "انصراف" %}</a>
    </div>
  </form>
</div>
{% endblock %}
