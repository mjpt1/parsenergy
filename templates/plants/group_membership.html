{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="panel">
  <h1 class="h4 mb-3">{% trans "افزودن نیروگاه به گروه" %}</h1>
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">{% trans "نیروگاه" %}</label>
        {{ form.plant }}
      </div>
      <div class="col-md-6">
        <label class="form-label">{% trans "گروه" %}</label>
        {{ form.group }}
      </div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn">{% trans "ثبت" %}</button>
      <a class="btn secondary" data-ajax="true" href="{% url 'plants:groups' %}">{% trans "بازگشت" %}</a>
    </div>
  </form>
</div>
{% endblock %}
