{% extends 'base_portal.html' %}
{% load i18n %}
{% block content %}
<div style="max-width:520px;margin:0 auto;text-align:center">
  <div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 20px">
    <div style="width:62px;height:62px;border-radius:50%;background:#e8f5e9;color:var(--green);
                display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 14px">✓</div>
    <h1 style="font-size:1.2rem;margin:0 0 8px">{% trans "اطلاعات پروژه تکمیل شد" %}</h1>
    <p style="color:var(--muted);font-size:.93rem;margin:0">
      {% blocktrans with code=lead.lead_code %}شناسهٔ پیگیری شما {{ code }} است. کارشناسان ما به‌زودی با شما تماس می‌گیرند.{% endblocktrans %}
    </p>
  </div>
</div>
{% endblock %}
