# Production-style stack: Postgres + Redis + Gunicorn(ASGI) + Celery + Nginx.
# Override secrets/hosts via a .env file next to this compose file.

x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  DEBUG: "0"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  DATABASE_URL: postgres://${POSTGRES_USER:-solarops}:${POSTGRES_PASSWORD:-solarops}@db:5432/${POSTGRES_DB:-solarops}
  REDIS_URL: redis://redis:6379/0
  USE_REDIS_CACHE: "1"
  USE_REDIS_CHANNELS: "1"
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solarops}
      POSTGRES_USER: ${POSTGRES_USER:-solarops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solarops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solarops}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    expose:
      - "8000"

  celery:
    build: .
    restart: unless-stopped
    command: celery -A solarops worker -l info
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media

  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A solarops beat -l info
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro

volumes:
  pgdata:
  staticfiles:
  media:
